baseURL = "https://bawantha.github.io/"
languageCode = "en-au"
title = "Bawantha Ra."
theme = "PaperMod"
enableRobotsTXT = true

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  description = "Simple portfolio site for Bawantha Ra."
  keywords = ["Bawantha", "Portfolio", "Flutter", "Android", "Australia"]
  author = "Bawantha Ra."
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  images = ["https://github.com/bawantha.png"]

  [params.label]
    text = "Bawantha Ra."

  [params.profileMode]
    enabled = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/bawantha"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:bawanth.inbox@gmail.com"

  [params.homeIntro]
    title = "Bawantha Ra."
    lead = "I build mobile apps and software that feel simple, fast, and useful."
    blurb = "This is a small portfolio with a short introduction and a few selected projects."

  [params.aboutSection]
    title = "About"
    text = "I am a software engineer based in Australia, focused on mobile development, backend systems, and product-minded engineering. I like building clean experiences and reliable systems behind them."

  [[params.projectCards]]
    title = "payhere_flutter"
    text = "A Flutter wrapper for the native PayHere Android SDK."
    url = "https://github.com/bawantha/payhere_flutter"

  [[params.projectCards]]
    title = "flutter-widget-catcher"
    text = "A small tool to help inspect and iterate on Flutter UI."
    url = "https://github.com/bawantha/flutter-widget-catcher"

  [[params.projectCards]]
    title = "composifi"
    text = "Jetpack Compose experiments around polished mobile UI."
    url = "https://github.com/bawantha/composifi"

  [[params.projectCards]]
    title = "ktor-banking"
    text = "A Kotlin backend experiment around banking-style APIs."
    url = "https://github.com/bawantha/ktor-banking"

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 10

[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 20
